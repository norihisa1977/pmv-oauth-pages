<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: 'wasm-unsafe-eval'; connect-src 'self' https://www.googleapis.com; img-src blob:; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
<title>PMV Production Photos</title>
<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  margin:24px;
  line-height:1.5;
  max-width:760px
}
input,button{
  font:inherit;
  padding:12px 14px
}
input{
  width:min(100%,420px);
  box-sizing:border-box
}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#f5f5f5;
  padding:12px
}
.note{
  background:#fff8d8;
  padding:12px
}
img{
  display:block;
  max-width:100%;
  height:auto;
  margin-top:18px
}

#photoGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:18px}
#photoGrid button{border:0;padding:0;background:#eee;aspect-ratio:1/1;overflow:hidden;border-radius:4px}
#photoGrid img{width:100%;height:100%;object-fit:cover;margin:0}
#photo:not([hidden]){position:fixed;inset:0;margin:auto;max-width:100vw;max-height:100vh;z-index:20;background:#000;object-fit:contain}
@media(min-width:700px){#photoGrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PMV">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./pmv-icon.svg">
</head>
<body>

<h1>PMV Production Photos</h1>

<p class="note">
This viewer loads the encrypted Generation 2 catalog and encrypted thumbnails for all 392 Production photos. Full-size ciphertext is downloaded and decrypted only after a photo is selected. No plaintext photo is written to persistent storage.
</p>

<label>
PMV Password
<br>
<input
  id="password"
  type="password"
  autocomplete="current-password">
</label>

<br><br>

<button id="run">
Open 392 Photos
</button>

<button
  id="clear"
  disabled>
Lock / Clear
</button>

<pre id="report">READY</pre>

<div id="photoGrid" hidden></div>
<img
  id="photo"
  alt="PMV Production photo"
  hidden>

<script
  type="module"
  src="./pc7c-photo-view.js">
</script>

</body>
</html>
