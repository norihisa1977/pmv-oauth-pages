};

document.getElementById('seek').onclick=async()=>{
 try{let ok=0;for(const t of [30,60,90]){v.currentTime=t;await wait(v,'seeked');const pass=Math.abs(v.currentTime-t)<1;add('SEEK_'+t+'S='+(pass?'PASS':'FAIL'));if(pass)ok++}add('SEEK_SUCCESS_COUNT='+ok+'/3');v.currentTime=0;await wait(v,'seeked');status.innerHTML='<strong>SEEK TEST DONE — start playback</strong>'}catch(e){add('SEEK_TEST=FAIL');add('ERROR='+String(e))}
};

document.getElementById('play').onclick=async()=>{
 waitCount=0;stallCount=0;errorCount=0;
 try{v.currentTime=0;add('PLAYBACK_BEGIN='+new Date().toISOString());await v.play();await wait(v,'ended',130000);add('PLAYBACK_ENDED=PASS');add('WAITING_EVENT_COUNT='+waitCount);add('STALLED_EVENT_COUNT='+stallCount);add('MEDIA_ERROR_COUNT='+errorCount);const d=v.duration>=119&&v.duration<=121;add('DURATION_120S='+(d?'PASS':'FAIL'));add('PERSISTENT_WRITE_BY_TEST_CODE=NONE');add('P3_MMS_VIDEO='+(d&&stallCount===0&&errorCount===0?'PASS':'FAIL'));status.innerHTML='<strong>PLAYBACK TEST DONE — copy report</strong>'}catch(e){add('PLAYBACK=FAIL');add('ERROR='+String(e))}
};

document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(r.textContent);alert('Report copied.')}catch{alert('Copy failed. Select report manually.')}};
